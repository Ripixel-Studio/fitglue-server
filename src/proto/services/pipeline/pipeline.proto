syntax = "proto3";

package fitglue.services.pipeline;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "models/activity/source.proto";
import "models/activity/standardized.proto";
import "models/pipeline/config.proto";
import "models/pipeline/execution.proto";
import "models/pipeline/pending_input.proto";

option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/services/pipeline";

service PipelineService {
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse) {
    option (google.api.http) = {
      get: "/v2/users/{user_id}/pipelines"
    };
  }
  rpc GetPipeline(GetPipelineRequest) returns (fitglue.models.pipeline.PipelineConfig) {
    option (google.api.http) = {
      get: "/v2/users/{user_id}/pipelines/{pipeline_id}"
    };
  }
  rpc CreatePipeline(CreatePipelineRequest) returns (fitglue.models.pipeline.PipelineConfig) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/pipelines"
      body: "pipeline"
    };
  }
  rpc UpdatePipeline(UpdatePipelineRequest) returns (fitglue.models.pipeline.PipelineConfig) {
    option (google.api.http) = {
      patch: "/v2/users/{user_id}/pipelines/{pipeline_id}"
      body: "pipeline"
    };
  }
  rpc DeletePipeline(DeletePipelineRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v2/users/{user_id}/pipelines/{pipeline_id}"
    };
  }
  
  rpc SubmitInput(SubmitInputRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/pending-inputs/{pending_input_id}/submit"
      body: "*"
    };
  }
  rpc ListPendingInputs(ListPendingInputsRequest) returns (ListPendingInputsResponse) {
    option (google.api.http) = {
      get: "/v2/users/{user_id}/pending-inputs"
    };
  }
  rpc ResolvePendingInput(ResolvePendingInputRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/pending-inputs/{pending_input_id}/resolve"
      body: "*"
    };
  }
  rpc CancelPipeline(CancelPipelineRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/pending-inputs/{pending_input_id}/cancel"
      body: "*"
    };
  }
  rpc CancelPipelineRun(CancelPipelineRunRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/pipeline-runs/{run_id}/cancel"
      body: "*"
    };
  }
  
  rpc RepostActivity(RepostActivityRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/activities/{activity_id}/repost"
      body: "*"
    };
  }

  // RefreshActivitySource re-pulls the activity from its origin (Strava / Garmin /
  // Apple Health …) and refreshes the immutable source layer of the persisted layered
  // record: the parsed source snapshot, a freshly-stored raw payload, and the ingest /
  // prune timestamps. Enrichers are NOT re-run (that is a separate, user-triggered
  // action — see the editable-activities spec); the derived activity is rebased onto the
  // freshly-pulled source and the user-edit overlay is preserved and still wins on read.
  // Returns the resolved (source + user overlay) activity so the caller can show the
  // refreshed data immediately.
  rpc RefreshActivitySource(RefreshActivitySourceRequest) returns (fitglue.models.activity.StandardizedActivity) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/activities/{activity_id}/refresh-source"
    };
  }

  // UpdateActivity writes the user-edit overlay of the persisted layered record: only
  // the editable fields named in update_mask (name / description / type / tags) are set
  // on the mutable overlay, which always wins on read. The immutable source layer and
  // the append-only enricher layers are left untouched — an edit never rewrites history.
  // The mask distinguishes clearing a field (named in the mask with an empty value) from
  // leaving it unchanged (absent from the mask). Returns the resolved (derived + overlay)
  // activity so the caller can render the edit immediately.
  rpc UpdateActivity(UpdateActivityRequest) returns (fitglue.models.activity.StandardizedActivity) {
    option (google.api.http) = {
      patch: "/v2/users/{user_id}/activities/{activity_id}"
      body: "*"
    };
  }

  // ResendActivity re-resolves the persisted layered activity (the derived fold with the
  // user-edit overlay applied) and re-pushes that resolved result to the activity's
  // configured destinations. Enrichers are NOT re-run — re-send sends the current
  // resolved state, so "what will be sent" is exactly the resolved activity the read API
  // shows. Destinations that already received the activity are updated in place rather
  // than duplicated.
  rpc ResendActivity(ResendActivityRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/activities/{activity_id}/resend"
      body: "*"
    };
  }


  rpc GetPipelineRun(GetPipelineRunRequest) returns (fitglue.models.pipeline.PipelineRun) {
    option (google.api.http) = {
      get: "/v2/users/{user_id}/pipeline-runs/{run_id}"
    };
  }
  rpc ListPipelineRuns(ListPipelineRunsRequest) returns (ListPipelineRunsResponse) {
    option (google.api.http) = {
      get: "/v2/users/{user_id}/pipeline-runs"
    };
  }

  rpc AdminListPipelineRuns(AdminListPipelineRunsRequest) returns (AdminListPipelineRunsResponse) {
    option (google.api.http) = {
      get: "/v2/admin/pipeline-runs"
    };
  }

  rpc ListSourceActivities(ListSourceActivitiesRequest) returns (ListSourceActivitiesResponse) {
    option (google.api.http) = {
      get: "/v2/users/{user_id}/pipelines/{pipeline_id}/source-activities"
    };
  }

  rpc BackfillActivities(BackfillActivitiesRequest) returns (BackfillActivitiesResponse) {
    option (google.api.http) = {
      post: "/v2/users/{user_id}/pipelines/{pipeline_id}/backfill"
      body: "*"
    };
  }
}

// Admin pipeline runs
message AdminListPipelineRunsRequest {
  string status = 1;
  string source = 2;
  string user_id = 3; // optional filter
  int32 limit = 4;
  string page_token = 5;
}
message AdminListPipelineRunsResponse {
  repeated fitglue.models.pipeline.PipelineRun runs = 1;
  string next_page_token = 2;
}

message ListPipelinesRequest {
  string user_id = 1;
}

message ListPipelinesResponse {
  repeated fitglue.models.pipeline.PipelineConfig pipelines = 1;
}

message GetPipelineRequest {
  string user_id = 1;
  string pipeline_id = 2;
}

message CreatePipelineRequest {
  string user_id = 1;
  fitglue.models.pipeline.PipelineConfig pipeline = 2;
}

message UpdatePipelineRequest {
  string user_id = 1;
  string pipeline_id = 2;
  fitglue.models.pipeline.PipelineConfig pipeline = 3;
}

message DeletePipelineRequest {
  string user_id = 1;
  string pipeline_id = 2;
}

message SubmitInputRequest {
  string user_id = 1;
  string pending_input_id = 2;
  map<string, string> input_data = 3;
}

message ListPendingInputsRequest {
  string user_id = 1;
}

message ListPendingInputsResponse {
  repeated fitglue.models.pipeline.PendingInput inputs = 1;
}

message ResolvePendingInputRequest {
  string user_id = 1;
  string pending_input_id = 2;
}

message CancelPipelineRequest {
  string user_id = 1;
  string pending_input_id = 2;
}

message CancelPipelineRunRequest {
  string user_id = 1;
  string run_id = 2;
}

message RepostActivityRequest {
  string user_id = 1;
  string activity_id = 2;
  // Repost mode: "missed-destination", "retry-destination", "full-pipeline"
  string mode = 3;
  // Target destination (required for missed-destination and retry-destination modes)
  string destination = 4;
}

message RefreshActivitySourceRequest {
  string user_id = 1;
  string activity_id = 2;
}

// UpdateActivityRequest carries user-edit overlay values plus an update_mask naming
// which of them to apply. update_mask is the authority: a field named in the mask is
// written to the overlay (a value absent from the request clears it to empty), a field
// absent from the mask is left unchanged. The mask is required because a repeated field
// (tags) cannot use proto3 `optional`, so an empty tags list would otherwise be
// ambiguous between "clear all tags" and "don't touch tags".
message UpdateActivityRequest {
  string user_id = 1;
  string activity_id = 2;
  string name = 3;
  string description = 4;
  fitglue.models.activity.ActivityType type = 5;
  repeated string tags = 6;
  // Editable overlay fields to apply: "name" | "description" | "type" | "tags".
  repeated string update_mask = 7;
}

message ResendActivityRequest {
  string user_id = 1;
  string activity_id = 2;
}

message GetPipelineRunRequest {
  string user_id = 1;
  string run_id = 2;
}

message ListPipelineRunsRequest {
  string user_id = 1;
  string pipeline_id = 2;
  int32 limit = 3;
  string page_token = 4;
  optional google.protobuf.Timestamp since = 5;
  optional google.protobuf.Timestamp until = 6;
}

message ListPipelineRunsResponse {
  repeated fitglue.models.pipeline.PipelineRun runs = 1;
  string next_page_token = 2;
}

message SourceActivityItem {
  string source_activity_id = 1;
  string title              = 2;
  string type               = 3;
  google.protobuf.Timestamp start_time = 4;
  bool   already_synced     = 5;
}

message ListSourceActivitiesRequest {
  string user_id     = 1;
  string pipeline_id = 2;
  string source      = 3;
  string page_token  = 4;
}

message ListSourceActivitiesResponse {
  repeated SourceActivityItem activities = 1;
  string next_page_token                 = 2;
}

message BackfillActivitiesRequest {
  string user_id                      = 1;
  string pipeline_id                  = 2;
  string source                       = 3;
  repeated string source_activity_ids = 4;
}

message BackfillActivitiesResponse {
  int32 queued_count = 1;
}
