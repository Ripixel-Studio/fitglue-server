            type: object
            properties:
                id:
                    type: string
                runId:
                    type: string
        CreateBillingPortalAdminRequest:
            type: object
            properties:
                id:
                    type: string
                returnUrl:
                    type: string
            description: '----------------------- Billing -----------------------'
        CreateBillingPortalAdminResponse:
            type: object
            properties:
                url:
                    type: string
        DestinationConfig:
            type: object
            properties:
                config:
                    type: object
                    additionalProperties:
                        type: string
                excludedEnrichers:
                    type: array
                    items:
                        type: string
        DestinationOutcome:
            type: object
            properties:
                destination:
