                    additionalProperties:
                        type: string
                result:
                    type: string
                error:
                    type: string
                timestamp:
                    type: string
                    format: date-time
            description: '----------------------- Audit Log -----------------------'
        AdminEmptyResponse:
            type: object
            properties: {}
        AdminIntegrationSummary:
            type: object
            properties:
                provider:
                    type: string
                enabled:
                    type: boolean
                connected:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                tokenHealth:
                    type: string
                    description: '"valid" | "expired" | "n/a" (n/a = provider has no expiring token)'
            description: |-
                AdminIntegrationSummary is a redacted view of a connected provider — it never
                 includes tokens or secrets, only status/health metadata.
        AdminPendingInputSummary:
            type: object
            properties:
                id:
                    type: string
                activityId:
                    type: string
                enricherProviderId:
                    type: string
                status:
                    type: string
                createdAt:
                    type: string
                    format: date-time
        AdminPipelineRunStats:
            type: object
            properties:
                total:
                    type: integer
                    format: int32
                byStatus:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
                bySource:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
        AdminPipelineSummary:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                source:
                    type: string
                destinations:
                    type: array
                    items:
                        type: string
                enabled:
                    type: boolean
        AdminUserBilling:
            type: object
            properties:
                subscription:
                    $ref: '#/components/schemas/SubscriptionState'
                effectiveTier:
                    enum:
                        - USER_TIER_UNSPECIFIED
                        - USER_TIER_HOBBYIST
                        - USER_TIER_ATHLETE
                    type: string
                    format: enum
                isTrial:
                    type: boolean
        AdminUserDetail:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/UserProfile'
                integrations:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminIntegrationSummary'
                pipelines:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminPipelineSummary'
                activityCount:
                    type: integer
                    format: int32
                pipelineRunCount:
                    type: integer
                    format: int32
                pendingInputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminPendingInputSummary'
                billing:
                    $ref: '#/components/schemas/AdminUserBilling'
            description: AdminUserDetail is the aggregated 360-degree view of a single user.
        AdminUserSummary:
            type: object
            properties:
                userId:
                    type: string
                email:
                    type: string
                displayName:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                tier:
                    enum:
                        - USER_TIER_UNSPECIFIED
                        - USER_TIER_HOBBYIST
                        - USER_TIER_ATHLETE
                    type: string
                    format: enum
                isAdmin:
                    type: boolean
                accessEnabled:
                    type: boolean
                syncCountThisMonth:
                    type: integer
                    format: int32
                preventedSyncCount:
                    type: integer
                    format: int32
                integrationCount:
                    type: integer
                    format: int32
                pipelineCount:
                    type: integer
                    format: int32
                trialEndsAt:
                    type: string
                    format: date-time
                stripeCustomerId:
                    type: string
                integrations:
                    type: array
                    items:
                        type: string
            description: |-
                AdminUserSummary is the per-row shape for the user directory. It carries the
                 derived counts the table needs without the client having to aggregate.
        BoosterExecution:
            type: object
            properties:
                providerName:
                    type: string
                durationMs:
                    type: string
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                error:
                    type: string
                status:
                    enum:
                        - EXECUTION_STEP_STATUS_UNSPECIFIED
                        - EXECUTION_STEP_STATUS_QUEUED
                        - EXECUTION_STEP_STATUS_RUNNING
                        - EXECUTION_STEP_STATUS_OK
                        - EXECUTION_STEP_STATUS_PASS
                        - EXECUTION_STEP_STATUS_SKIPPED
                        - EXECUTION_STEP_STATUS_FAILED
                        - EXECUTION_STEP_STATUS_RETRIED
                    type: string
                    format: enum
